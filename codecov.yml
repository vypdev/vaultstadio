# Codecov configuration for VaultStadio
# See https://docs.codecov.com/docs/codecovyml-reference
#
# Coverage gate: status.project.default.threshold: 1% means the PR status
# check tolerates a project coverage decrease of up to 1 percentage point.
# This project target is distinct from patch coverage; targets remain unchanged.

coverage:
  precision: 2
  round: down
  range: "60..80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
