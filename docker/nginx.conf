map $uri $vaultstadio_log_path {
    default $uri;
    ~^/api/v1/share/ /api/v1/share/[redacted];
}

# Do not log query strings or Referer: either can contain a public capability.
log_format vaultstadio '$remote_addr - $remote_user [$time_local] '
    '"$request_method $vaultstadio_log_path $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log vaultstadio;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream diagnostics can echo the original request, bypassing log_format.
        # Public failures remain observable through the redacted access status.
        location ~ ^/api/v1/share/ {
            proxy_pass http://backend:8080;
            error_log /dev/null;
        }
    }

    # Health check
    location /health {
        proxy_pass http://backend:8080/health;
    }
    
    # WASM MIME type
    location ~ \.wasm$ {
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
    }
}
