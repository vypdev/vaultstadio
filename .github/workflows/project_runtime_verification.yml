name: Project runtime verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Complete verification or read-only runner inventory
        type: choice
        default: complete
        options: [complete, inventory]
      placement:
        description: Candidate verification placement (inventory uses the selected self-hosted route)
        type: choice
        default: hosted-linux
        options: [hosted-linux, macos-arm64]
  workflow_call:
    inputs:
      mode:
        type: string
        default: complete
      placement:
        type: string
        default: hosted-linux
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read

concurrency:
  group: project-runtime-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'complete' }}-${{ inputs.placement || 'hosted-linux' }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Native project verification (${{ inputs.placement || 'hosted-linux' }})
    if: ${{ inputs.mode != 'inventory' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON(inputs.placement == 'macos-arm64' && '{"group":"vypdev","labels":["self-hosted","macOS","ARM64"]}' || '"ubuntu-24.04"') }}
    timeout-minutes: 90
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false'
      VERIFICATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFICATION_SOURCE_SHA }}
          persist-credentials: false

      - name: Check storage headroom before provisioning
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil
          minimum = 12 * 1024 ** 3
          for label, path in [('workspace', os.environ['GITHUB_WORKSPACE']), ('temporary', os.environ['RUNNER_TEMP'])]:
              available = shutil.disk_usage(path).free
              print(f'{label}: {available / 1024 ** 3:.2f} GiB available; minimum 12 GiB')
              if available < minimum:
                  raise SystemExit(f'Insufficient storage for native verification on {label}')
          PY

      - name: Provision the hosted runner browser sandbox from its signed package
        if: runner.os == 'Linux'
        shell: bash
        run: sudo bash scripts/ci/provision_browser_sandbox.sh

      - name: Run runtime adapter controls on the native runner
        run: python3 -m unittest discover -s .github/actions/copilot-verification-setup/tests -p 'test_*.py' -v

      - name: Record prerequisites before preparing the candidate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/verification-evidence"
          python3 scripts/ci/inspect_verification_runner.py --report "$RUNNER_TEMP/verification-evidence/prerequisites-before-setup.json"

      - name: Create the job-owned verification profile
        shell: bash
        run: |
          profile=$(mktemp -d "$RUNNER_TEMP/vaultstadio-verification.XXXXXX")
          chmod 700 "$profile"
          {
            printf 'HOME=%s\n' "$profile"
            printf 'GRADLE_USER_HOME=%s/.gradle\n' "$profile"
            printf 'DOCKER_CONFIG=%s/.docker\n' "$profile"
            printf 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock\n'
            printf 'DOCKER_TLS_VERIFY=\nDOCKER_CERT_PATH=\nDOCKER_AUTH_CONFIG=\n'
            printf 'DOCKER_HOST=\nDOCKER_CONTEXT=\n'
          } >> "$GITHUB_ENV"
          # Runner-owned temporary files are retired after all native post steps.

      - name: Execute the candidate project setup
        id: runtime
        timeout-minutes: 5
        uses: ./.github/actions/copilot-verification-setup

      - name: Record actual source and runtime identities
        id: provenance
        shell: bash
        env:
          VERIFICATION_CHROME_BIN: ${{ steps.runtime.outputs.chrome-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/verification-evidence"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != os.environ['VERIFICATION_SOURCE_SHA']:
              raise SystemExit('The checked-out revision differs from the requested candidate')
          browser = os.environ.get('VERIFICATION_CHROME_BIN', '')
          if not Path(browser).is_absolute() or not Path(browser).is_file() or not os.access(browser, os.X_OK):
              raise SystemExit('The setup-selected browser executable is missing or unusable')
          record = {
              'source': actual, 'system': platform.system(), 'architecture': platform.machine(),
              'java': subprocess.check_output(['java', '-version'], stderr=subprocess.STDOUT, text=True),
              'browser': subprocess.check_output([browser, '--version'], text=True),
              'scope': 'candidate setup on the selected runner; official trusted-main Copilot verification remains separate',
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'verification-evidence/provenance.json'
          output.write_text(json.dumps(record, indent=2) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as environment:
              environment.write(f'CHROME_BIN={browser}\n')
          print(json.dumps(record, indent=2))
          PY

      - name: Require actual sandboxed headless startup
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'verification-evidence/browser-smoke.html'
          with output.open('w') as stream:
              subprocess.run([os.environ['CHROME_BIN'], '--headless', '--disable-gpu', '--dump-dom',
                              'data:text/html,<title>vaultstadio-sandbox-smoke</title>'],
                             stdout=stream, check=True, timeout=45)
          html = output.read_text()
          if '<title>vaultstadio-sandbox-smoke</title>' not in html:
              raise SystemExit('The sandboxed browser did not render the expected DOM')
          PY

      - name: Run configured make test
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        run: make test

      - name: Run configured make test-coverage
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        run: make test-coverage

      - name: Run configured make lint
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        run: make lint

      - name: Run configured git diff --check
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        run: git diff --check

      - name: Run complete backend suites independently
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        working-directory: backend
        run: ./gradlew test --continue --rerun-tasks --no-daemon

      - name: Run complete desktop suites independently
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        working-directory: frontend
        run: ./gradlew desktopTest --continue --rerun-tasks --no-daemon

      - name: Run complete browser suites without Make suppression
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        working-directory: frontend
        run: ./gradlew wasmJsBrowserTest --continue --rerun-tasks --no-daemon

      - name: Require unchanged tracked source after verification
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        run: git diff --exit-code

      - name: Preserve raw results and source provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-project-verification-${{ inputs.placement || 'hosted-linux' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verification-evidence
            backend/**/build/test-results/**/*.xml
            frontend/**/build/test-results/**/*.xml
            backend/**/build/reports/jacoco/**/*.xml
            frontend/**/build/reports/jacoco/**/*.xml
            backend/**/build/reports/detekt/*
            frontend/**/build/reports/detekt/*
          retention-days: 14
          if-no-files-found: warn

  runner-inventory:
    name: Runner inventory (${{ inputs.placement || 'hosted-linux' }}, diagnostic only)
    if: ${{ inputs.mode == 'inventory' && github.event_name == 'workflow_dispatch' }}
    runs-on:
      group: vypdev
      labels: ${{ fromJSON(inputs.placement == 'macos-arm64' && '["self-hosted","macOS","ARM64"]' || '["self-hosted","codex","Linux"]') }}
    timeout-minutes: 5
    steps:
      - name: Check out the trusted default branch for diagnostics
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect existing prerequisites without installing them
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/ci/inspect_verification_runner.py --report "$RUNNER_TEMP/runner-prerequisites.json"
      - name: Preserve inventory (not a readiness result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-runner-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/runner-prerequisites.json
          if-no-files-found: error
          retention-days: 14
