# VaultStadio Security Scanning
#
# This workflow runs security scans on the codebase and Docker images.
# Container scans use the Docker-capable Apple Silicon runners; other scans use macOS X64.

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'

jobs:
  # ==================== Dependency Scan ====================
  dependency-scan:
    name: Dependency Vulnerability Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run dependency check (backend)
        run: cd backend && ./gradlew dependencies --no-daemon || true

      - name: Run dependency check (frontend)
        run: cd frontend && ./gradlew dependencies --no-daemon || true

  # ==================== Code Security Scan ====================
  code-scan:
    name: Code Security Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Isolate CodeQL database and Gradle state for this analysis
        id: codeql-state
        shell: bash
        run: |
          state_directory="$(mktemp -d "$RUNNER_TEMP/vaultstadio-codeql.XXXXXX")"
          echo "database=$state_directory/databases" >> "$GITHUB_OUTPUT"
          echo "GRADLE_USER_HOME=$state_directory/gradle" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin, javascript
          db-location: ${{ steps.codeql-state.outputs.database }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Keep traced Kotlin compilation in this job's JVM; a shared compiler
      # daemon can outlive the build and write into a finalized source archive.
      - name: Build backend for analysis
        working-directory: backend
        run: ./gradlew :api:build -x test --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process

      - name: Build frontend for analysis
        working-directory: frontend
        run: |
          ./gradlew :composeApp:compileKotlinDesktop --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==================== Container Scan ====================
  container-scan:
    name: Container Security Scan
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        run: |
          docker build --platform linux/amd64 -f docker/Dockerfile.backend -t vaultstadio-backend:scan . || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: success()
        with:
          image-ref: 'vaultstadio-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ==================== Secret Scanning ====================
  secret-scan:
    name: Secret Detection
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for org repos: get a free license at gitleaks.io and add as repo/org secret
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true
