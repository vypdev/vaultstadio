# VaultStadio Security Scanning
#
# This workflow runs security scans on the codebase and Docker images.
# Container scans use the Docker-capable Apple Silicon runners; other scans use macOS X64.

name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Code Security Scan ====================
  code-scan:
    name: Code Security Scan
    timeout-minutes: 60
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Isolate CodeQL database and Gradle state for this analysis
        id: codeql-state
        shell: bash
        run: |
          state_directory="$(mktemp -d "$RUNNER_TEMP/vaultstadio-codeql.XXXXXX")"
          echo "database=$state_directory/databases" >> "$GITHUB_OUTPUT"
          echo "GRADLE_USER_HOME=$state_directory/gradle" >> "$GITHUB_ENV"
          mkdir -p "$state_directory/gradle"
          # In-process Kotlin needs class metadata space as well as heap. Bound
          # workers so concurrent module compilers fit on the shared runner.
          cat > "$state_directory/gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          PROPERTIES

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin, javascript
          db-location: ${{ steps.codeql-state.outputs.database }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Keep traced Kotlin compilation in this job's JVM; a shared compiler
      # daemon can outlive the build and write into a finalized source archive.
      - name: Build backend for analysis
        working-directory: backend
        run: ./gradlew :api:build -x test --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process

      - name: Build frontend for analysis
        working-directory: frontend
        run: |
          ./gradlew :composeApp:compileKotlinDesktop --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==================== Container Scan ====================
  container-scan:
    name: Container Security Scan
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      SCAN_IMAGE: vaultstadio-backend:scan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate backend image for scanning
        id: scan-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          cache-from: type=gha,scope=vaultstadio-backend

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          # Isolated caches download the Java DB before the first image scan.
          timeout: '30m'
          format: 'sarif'
          output: 'trivy-results.sarif'
          cache-dir: ${{ runner.temp }}/trivy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Trivy scan results
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Remove this job's scan image
        if: ${{ always() && steps.scan-image.outcome == 'success' }}
        run: docker image rm "$SCAN_IMAGE"
