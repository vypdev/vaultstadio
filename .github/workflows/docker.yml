# VaultStadio Docker Build and Publish
# Builds and pushes Docker images on releases and main/master branch
# Docker jobs: Apple Silicon runners in group vypdev; images remain linux/amd64.

name: Docker Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, develop]
    paths:
      - .github/workflows/docker.yml
      - .github/actions/prepare-docker/**
      - .github/scripts/test_backend_runtime.sh
      - backend/**
      - frontend/**
      - docker/**
      - .dockerignore
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-backend:
    name: Build Backend Image
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          project-root: backend
      
      - name: Build backend JAR
        working-directory: backend
        run: ./gradlew :api:build -x test
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && format('vaultstadio-runtime-test:{0}-{1}', github.run_id, github.run_attempt) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vaultstadio-backend
          cache-to: type=gha,mode=max,scope=vaultstadio-backend

      - name: Verify the candidate JRE and application startup
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        env:
          CANDIDATE_IMAGE: vaultstadio-runtime-test:${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/test_backend_runtime.sh "$CANDIDATE_IMAGE"

      - name: Retire this job's local smoke tag
        if: always() && github.event_name == 'pull_request'
        env:
          CANDIDATE_IMAGE: vaultstadio-runtime-test:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if docker image inspect "$CANDIDATE_IMAGE" >/dev/null 2>&1; then
            docker image rm "$CANDIDATE_IMAGE"
          fi

  build-frontend:
    name: Build Frontend Image
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      
      - name: Build frontend (Web)
        run: cd frontend && ./gradlew :composeApp:wasmJsBrowserProductionWebpack
        continue-on-error: true
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vaultstadio-frontend
          cache-to: type=gha,mode=max,scope=vaultstadio-frontend
        continue-on-error: ${{ github.event_name != 'pull_request' }}

  # Create release artifacts
  release:
    name: Create Release
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    needs: [build-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          project-root: backend
      
      - name: Build release artifacts
        working-directory: backend
        run: ./gradlew :api:distZip -x test
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            backend/api/build/distributions/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
