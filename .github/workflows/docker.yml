# VaultStadio Docker Build and Publish
# Manual candidate builds; version-tag pushes retain image/release publication
# Docker jobs: Apple Silicon runners in group vypdev; images remain linux/amd64.

name: Docker Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-backend:
    name: Build Backend Image
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      
      - name: Log in to Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'workflow_dispatch' && format('vaultstadio-runtime-test:{0}-{1}', github.run_id, github.run_attempt) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vaultstadio-backend
          cache-to: type=gha,mode=max,scope=vaultstadio-backend

      - name: Verify the candidate JRE and application startup
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        env:
          CANDIDATE_IMAGE: vaultstadio-runtime-test:${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/test_backend_runtime.sh "$CANDIDATE_IMAGE"

      - name: Retire this job's local smoke tag
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_IMAGE: vaultstadio-runtime-test:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if docker image inspect "$CANDIDATE_IMAGE" >/dev/null 2>&1; then
            docker image rm "$CANDIDATE_IMAGE"
          fi

  build-frontend:
    name: Build Frontend Image
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2

      - name: Verify frontend Wasm MIME contract
        run: python3 scripts/check-frontend-wasm-mime.py
        timeout-minutes: 3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      
      - name: Build frontend (Web)
        run: cd frontend && ./gradlew :composeApp:wasmJsBrowserProductionWebpack
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      
      - name: Log in to Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vaultstadio-frontend
          cache-to: type=gha,mode=max,scope=vaultstadio-frontend

  # Create release artifacts
  release:
    name: Create Release
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          project-root: backend
      
      - name: Build release artifacts
        working-directory: backend
        run: ./gradlew :api:distZip -x test
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            backend/api/build/distributions/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
