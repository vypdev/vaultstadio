name: Secret scanning

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Detection
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install digest-checked upstream secret scanners
        id: tools
        shell: bash
        run: |
          state=$(mktemp -d "$RUNNER_TEMP/secret-scanners.XXXXXX")
          mkdir -m 700 "$state/tools"
          {
            printf 'SECRET_SCANNER_STATE=%s\n' "$state"
            printf 'SECRET_SCANNER_TOOLS=%s/tools\n' "$state"
          } >> "$GITHUB_ENV"
          python3 scripts/ci/install_secret_tools.py "$state/tools"

      - name: Exercise real scanner detection and failure controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_secret_*.py' -v

      - name: Scan complete candidate history with both scanners
        id: scan
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/ci/run_secret_scan.py --repository "$GITHUB_WORKSPACE" \
            --tools "$SECRET_SCANNER_TOOLS" --head "$SOURCE_SHA" \
            --report "$SECRET_SCANNER_STATE/summary.json"

      - name: Preserve secret-safe scan result
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-summary
          path: ${{ env.SECRET_SCANNER_STATE }}/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Retire this job's scanner state
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil, stat
          from pathlib import Path
          raw = os.environ.get('SECRET_SCANNER_STATE')
          if raw:
              state = Path(raw)
              parent = Path(os.environ['RUNNER_TEMP']).resolve()
              metadata = state.lstat()
              if (state.is_symlink() or state.resolve().parent != parent
                      or not state.name.startswith('secret-scanners.')
                      or not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != os.getuid()):
                  raise SystemExit('Refusing to remove an unowned scanner directory')
              shutil.rmtree(state)
          PY
