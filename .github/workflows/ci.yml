# VaultStadio CI Pipeline
# Runs on every push and pull request
# Runners: shared self-hosted Linux/macOS; Docker/Testcontainers on Apple Silicon

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'

jobs:
  # Build and test the Kotlin backend
  backend:
    name: Backend Build & Test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          project-root: backend
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
      
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker

      - name: Configure Testcontainers for the runner Docker context
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          case "$endpoint" in
            unix:///*) ;;
            *) echo "Expected the runner's local Unix Docker socket." >&2; exit 1 ;;
          esac
          printf 'DOCKER_HOST=%s\n' "$endpoint" >> "$GITHUB_ENV"
          echo 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock' >> "$GITHUB_ENV"

      - name: Ensure Docker is available (for Testcontainers)
        run: |
          if [ -d "/Applications/Docker.app" ]; then
            echo "Starting Docker Desktop..."
            open -a Docker
            echo "Waiting for Docker daemon (up to 90s)..."
            for i in $(seq 1 45); do
              if docker info >/dev/null 2>&1; then
                echo "Docker is ready."
                break
              fi
              if [ $i -eq 45 ]; then
                echo "Docker did not become ready in time."
                exit 1
              fi
              sleep 2
            done
          else
            echo "Checking Docker..."
            docker info || exit 1
          fi
      
      - name: Build backend modules
        working-directory: backend
        run: |
          ./gradlew :core:build \
            :plugins-api:build \
            :infrastructure:build \
            :api:build \
            -x test
      
      - name: Run backend tests
        working-directory: backend
        run: |
          ./gradlew :core:test \
            :domain:storage:test \
            :core:storage:test \
            :api:test \
            :infrastructure:test \
            :plugins-api:test \
            :plugins:image-metadata:test \
            :plugins:video-metadata:test \
            :plugins:fulltext-search:test \
            :plugins:ai-classification:test \
            --continue

      - name: Verify storage authorization coverage
        working-directory: backend
        run: |
          ./gradlew :domain:storage:jacocoTestCoverageVerification \
            :core:storage:jacocoTestCoverageVerification

      - name: Generate backend coverage reports
        working-directory: backend
        run: |
          ./gradlew :core:jacocoTestReport \
            :domain:storage:jacocoTestReport \
            :core:storage:jacocoTestReport \
            :api:jacocoTestReport \
            :infrastructure:jacocoTestReport \
            :plugins-api:jacocoTestReport \
            :plugins:image-metadata:jacocoTestReport \
            :plugins:video-metadata:jacocoTestReport \
            :plugins:fulltext-search:jacocoTestReport \
            :plugins:ai-classification:jacocoTestReport \
            --continue

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 7

      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-backend
          path: |
            backend/core/build/reports/jacoco/test/jacocoTestReport.xml
            backend/domain/storage/build/reports/jacoco/test/jacocoTestReport.xml
            backend/core/storage/build/reports/jacoco/test/jacocoTestReport.xml
            backend/api/build/reports/jacoco/test/jacocoTestReport.xml
            backend/infrastructure/build/reports/jacoco/test/jacocoTestReport.xml
            backend/plugins-api/build/reports/jacoco/test/jacocoTestReport.xml
            backend/plugins/image-metadata/build/reports/jacoco/test/jacocoTestReport.xml
            backend/plugins/video-metadata/build/reports/jacoco/test/jacocoTestReport.xml
            backend/plugins/fulltext-search/build/reports/jacoco/test/jacocoTestReport.xml
            backend/plugins/ai-classification/build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

  # Build the frontend (standalone project in frontend/)
  frontend:
    name: Frontend Build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: frontend/.java-version
          distribution: jetbrains

      - name: Isolate Android SDK for this job
        shell: bash
        run: |
          sdk_root="$(mktemp -d "$RUNNER_TEMP/android-sdk.XXXXXX")"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build frontend (Desktop)
        run: cd frontend && ./gradlew :composeApp:compileKotlinDesktop :composeApp:createDistributable --no-build-cache

      - name: Set up Node for the pinned browser installer
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Install and verify the job-owned browser
        id: chrome
        run: python3 scripts/ci/setup_test_browser.py

      - name: Run frontend tests (desktop)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          cd frontend
          ./gradlew :composeApp:desktopTest :data:network:desktopTest :data:network:wasmJsBrowserTest \
            --continue --no-build-cache

      - name: Generate frontend coverage report
        run: |
          cd frontend
          ./gradlew :composeApp:jacocoTestReport :data:network:jacocoTestReport \
            :data:network:verifyInstantSerializerCoverage --continue --no-build-cache

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-frontend
          path: |
            frontend/composeApp/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            frontend/data/network/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 1

      - name: Run complete frontend desktop suites
        run: cd frontend && ./gradlew desktopTest --continue --no-build-cache

      - name: Report form module coverage
        run: cd frontend && ./gradlew :core:form:jacocoTestReport --continue --no-build-cache

      - name: Upload form module coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-form
          path: frontend/core/form/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 1

      - name: Run browser accessibility and dialog lifecycle contracts
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          cd frontend
          ./gradlew wasmJsBrowserTest --rerun --continue --no-build-cache

      - name: Enforce accessible input coverage
        run: cd frontend && ./gradlew :core:ui:jacocoTestReport :core:ui:verifyInputSemanticsCoverage --continue --no-build-cache

      - name: Upload accessible input coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-accessibility
          path: frontend/core/ui/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 1

  # Upload coverage to Codecov
  coverage:
    name: Coverage (Codecov)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download backend coverage reports
        uses: actions/download-artifact@v7
        with:
          name: jacoco-coverage-backend
          path: coverage-backend

      - name: Download frontend coverage report
        uses: actions/download-artifact@v7
        with:
          name: jacoco-coverage-frontend
          path: coverage-frontend

      - name: Download accessible input coverage
        uses: actions/download-artifact@v7
        with:
          name: jacoco-coverage-accessibility
          path: coverage-accessibility

      - name: Download form module coverage
        uses: actions/download-artifact@v7
        with:
          name: jacoco-coverage-form
          path: coverage-form

      - name: List coverage files (debug)
        run: |
          echo "=== coverage-backend ==="
          find coverage-backend -type f 2>/dev/null || true
          echo "=== coverage-frontend ==="
          find coverage-frontend -type f 2>/dev/null || true
          echo "=== all jacocoTestReport.xml in workspace ==="
          find . -name 'jacocoTestReport.xml' -type f 2>/dev/null || true

      - name: Discover coverage files for Codecov
        id: coverage-files
        run: |
          FILES=$(find . -name 'jacocoTestReport.xml' -type f 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "list=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No jacocoTestReport.xml found"
            exit 1
          fi
          echo "Found coverage files: $FILES"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: ${{ steps.coverage-files.outputs.list }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build plugins
  plugins:
    name: Plugins Build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          project-root: backend
      
      - name: Build plugins
        working-directory: backend
        run: |
          ./gradlew :plugins:image-metadata:build \
            :plugins:video-metadata:build \
            :plugins:fulltext-search:build \
            :plugins:ai-classification:build \
            -x test

  # Build Android app
  android:
    name: Android Build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      
      - name: Isolate Android SDK for this job
        shell: bash
        run: |
          sdk_root="$(mktemp -d "$RUNNER_TEMP/android-sdk.XXXXXX")"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      
      - name: Build Android APK (debug)
        run: cd frontend && ./gradlew :androidApp:assembleDevDebug

  # Code quality checks (no root Gradle; backend and frontend are standalone)
  lint:
    name: Lint & Code Quality
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      
      - name: Isolate Android SDK for this job
        shell: bash
        run: |
          sdk_root="$(mktemp -d "$RUNNER_TEMP/android-sdk.XXXXXX")"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      
      - name: Verify active frontend interaction inventory
        run: |
          python3 scripts/check-frontend-accessibility.py
          python3 -m unittest discover -s scripts/tests -p 'test_frontend_accessibility_inventory.py'
          python3 -m unittest discover -s scripts/tests -p 'test_test_browser_bootstrap.py'

      - name: Check no FQN in type positions
        run: ./scripts/check-no-fqn.sh
      
      - name: Run Detekt (backend)
        working-directory: backend
        run: ./gradlew detektMain --continue
      
      - name: Analyze actual accessibility and authentication sources
        run: |
          cd frontend
          ./gradlew :core:ui:detekt :core:form:detekt :core:resources:detekt :feature:auth:detekt \
            :composeApp:ktlintDesktopTestSourceSetCheck :composeApp:ktlintWasmJsTestSourceSetCheck --continue
          cd ..
          python3 scripts/check-frontend-accessibility.py --detekt-reports

      - name: Run Detekt (frontend)
        working-directory: frontend
        run: ./gradlew detektDesktopMain --continue
      
      - name: Upload Detekt report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: '**/build/reports/detekt/'
          retention-days: 7

  # Security scanning
  security:
    name: Security Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: 
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
