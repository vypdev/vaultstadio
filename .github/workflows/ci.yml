# VaultStadio CI Pipeline
# Complete fresh test suites on every PR update; heavy checks are scheduled separately.
# Runners: shared self-hosted Linux/macOS; Docker/Testcontainers on Apple Silicon

name: CI

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'

jobs:
  # Build and test the Kotlin backend
  backend:
    name: Backend Build & Test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          project-root: backend
          cache-read-only: false
      
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker

      - name: Configure Testcontainers for the runner Docker context
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          case "$endpoint" in
            unix:///*) ;;
            *) echo "Expected the runner's local Unix Docker socket." >&2; exit 1 ;;
          esac
          printf 'DOCKER_HOST=%s\n' "$endpoint" >> "$GITHUB_ENV"
          echo 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock' >> "$GITHUB_ENV"

      - name: Ensure Docker is available (for Testcontainers)
        run: |
          if [ -d "/Applications/Docker.app" ]; then
            echo "Starting Docker Desktop..."
            open -a Docker
            echo "Waiting for Docker daemon (up to 90s)..."
            for i in $(seq 1 45); do
              if docker info >/dev/null 2>&1; then
                echo "Docker is ready."
                break
              fi
              if [ $i -eq 45 ]; then
                echo "Docker did not become ready in time."
                exit 1
              fi
              sleep 2
            done
          else
            echo "Checking Docker..."
            docker info || exit 1
          fi
      
      - name: Run complete backend suites
        working-directory: backend
        run: ./gradlew test --rerun --continue --build-cache

      - name: Verify storage authorization coverage
        working-directory: backend
        run: |
          ./gradlew :domain:storage:jacocoTestCoverageVerification \
            :core:storage:jacocoTestCoverageVerification

      - name: Generate backend coverage reports
        working-directory: backend
        run: ./gradlew jacocoTestReport --continue --build-cache

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-backend
          path: backend/**/build/reports/jacoco/**/*.xml
          if-no-files-found: error
          retention-days: 1

  # Build the frontend (standalone project in frontend/)
  frontend:
    name: Frontend Build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, X64]

    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: frontend/.java-version
          distribution: jetbrains

      - name: Isolate Android SDK for this job
        shell: bash
        run: |
          sdk_root="$(mktemp -d "$RUNNER_TEMP/android-sdk.XXXXXX")"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: false

      - name: Install and verify the job-owned browser
        id: chrome
        run: python3 scripts/ci/setup_test_browser.py

      - name: Run complete frontend desktop suites
        working-directory: frontend
        run: ./gradlew desktopTest --rerun --continue --build-cache

      - name: Run complete frontend browser suites
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          ./gradlew wasmJsBrowserTest --rerun --continue --build-cache

      - name: Generate frontend coverage and enforce existing gates
        working-directory: frontend
        run: |
          ./gradlew jacocoTestReport :data:network:verifyInstantSerializerCoverage \
            :core:ui:verifyInputSemanticsCoverage --continue --build-cache

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/**/build/reports/tests/
            frontend/**/build/test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-frontend
          path: frontend/**/build/reports/jacoco/**/*.xml
          if-no-files-found: error
          retention-days: 1

  # Upload coverage to Codecov
  coverage:
    name: Coverage (Codecov)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    needs: [backend, frontend]

    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download backend coverage reports
        uses: actions/download-artifact@v7
        with:
          name: jacoco-coverage-backend
          path: coverage-backend

      - name: Download frontend coverage report
        uses: actions/download-artifact@v7
        with:
          name: jacoco-coverage-frontend
          path: coverage-frontend

      - name: Discover coverage files for Codecov
        id: coverage-files
        run: |
          FILES=$(find . -name 'jacocoTestReport.xml' -type f 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "list=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No jacocoTestReport.xml found"
            exit 1
          fi
          echo "Found coverage files: $FILES"

      - name: Isolate Codecov verification keyring
        run: bash scripts/ci/prepare_codecov_keyring.sh

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: ${{ steps.coverage-files.outputs.list }}
          version: v11.3.1
          skip_validation: false
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  quality:
    name: Source & Workflow Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install workflow parser
        run: python3 -m pip --isolated install --index-url https://pypi.org/simple PyYAML==6.0.3
      - name: Verify source and workflow contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check-frontend-accessibility.py
          python3 scripts/check-frontend-wasm-mime.py
          python3 scripts/validate-specification-catalog.py
          bash scripts/check-no-fqn.sh
          python3 -m unittest discover -s scripts/tests -p 'test_frontend_accessibility_inventory.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_test_browser_bootstrap.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_codecov_keyring.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_ci_cadence.py' -v
          python3 -m unittest discover -s .github/actions/copilot-verification-setup/tests -p 'test_*.py' -v
