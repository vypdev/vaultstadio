# Project-owned extension. Review on trusted MAIN_BRANCH before separate activation.
name: Prepare project verification
description: Prepare isolated JVM, Android SDK and browser prerequisites for existing checks.
runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Isolate Android SDK in the verification profile
      shell: bash
      run: |
        test -d "$HOME" && test ! -L "$HOME"
        test ! -L "$HOME/.vaultstadio-verification"
        sdk_root="$HOME/.vaultstadio-verification/android-sdk"
        mkdir -p "$sdk_root"
        printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"

    - name: Set up Android SDK 36
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
        log-accepted-android-sdk-licenses: 'false'

    - name: Set up headless Chrome
      id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      with:
        chrome-version: stable
        install-dependencies: 'true'

    - name: Prepare the project command environment
      shell: bash
      env:
        CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        VERIFICATION_ACTION_ROOT: ${{ github.action_path }}
      run: bash "$VERIFICATION_ACTION_ROOT/prepare-environment.sh"
